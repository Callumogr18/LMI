[project]
name = "pl-hackathon"
version = "0.1.0"
description = "Live Match Intelligence Desk: explainable, verified, personalized match commentary"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.155.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
